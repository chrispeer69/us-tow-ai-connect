name: secret-scan

# Runs gitleaks on every PR and push to main. Uses the repo's .gitleaks.toml
# (reviewed allowlist of placeholders/test fixtures). A genuine secret fails CI.
#
# Seeded in Session 41. Safe to enable now — the current history scans clean.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers all commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE only required for gitleaks-action on orgs; omit for
          # public/personal repos. Add as a secret if the org enforces licensing.
