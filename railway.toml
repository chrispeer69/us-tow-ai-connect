# Railway multi-service config for us-tow-ai-connect.
#
# Railway reads the [build] / [deploy] sections in the service it is currently
# deploying. The root-level [[services]] entries below let a single repo host
# both the NestJS API and the Next.js admin web app — each service in the
# Railway dashboard points at its matching name here.
#
# Postgres and Redis are managed Railway plugins added through the dashboard
# (Database -> Add Postgres / Redis). They are NOT declared in this file
# because Railway provisions them as separate first-class resources and
# exposes connection strings via the service variable reference system.
#
# Reference docs: https://docs.railway.app/reference/config-as-code

[[services]]
name = "api"

  [services.build]
  builder = "DOCKERFILE"
  dockerfilePath = "packages/api/Dockerfile"

  [services.deploy]
  # Apply DB migrations before booting the API. Drizzle's migrator is
  # idempotent so re-running on every deploy is safe.
  # `:prod` flavour invokes the compiled JS — the runtime image does not
  # ship tsx, so the dev `db:migrate` script (tsx src/db/migrate.ts) would
  # fail here.
  preDeployCommand = "pnpm --filter @ustow/api run db:migrate:prod"
  startCommand = "node packages/api/dist/main.js"
  healthcheckPath = "/health/ready"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5

[[services]]
name = "web"

  [services.build]
  builder = "DOCKERFILE"
  dockerfilePath = "packages/web/Dockerfile"

  [services.deploy]
  startCommand = "node packages/web/server.js"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 5
